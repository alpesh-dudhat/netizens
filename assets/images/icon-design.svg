<style>
.star {
  stroke-dasharray: 10;
  stroke-dashoffset:50;
  fill-opacity: 0;
  animation: draw 6s linear forwards infinite;
}

@keyframes draw {
  to {
    stroke-dashoffset: 0;
  }
}
.line {
    animation: bars 2s infinite;
    transform-origin: bottom;
    animation-delay: 0.2s;
    transform-box: fill-box;
}


@keyframes bars {
        0% {
        transform: scaleY(1);
        }
        50% {
        transform: scaleY(.20);
        }
