<style>

.star {
   fill: transparent;
    stroke: #3EAFD1;
    stroke-width:0.2;
    stroke-dasharray: 450;
    stroke-dashoffset: 0;
    animation: reveal 6s infinite linear both;
}

@keyframes reveal {
  0% {
    fill: #3EAFD1;
    stroke-dashoffset: 200;
  }

  20% {
    fill: transparent;
    stroke-dashoffset: 300;
  }

  50% {
    fill: transparent;
    stroke-dashoffset: 450;
  }

  80% {
    fill: transparent;
    stroke-dashoffset: 900;
  }

  90% {
    fill: #3EAFD1;
    stroke-dashoffset: 900;
  }

  100% {
    fill: #3EAFD1;
    stroke-dashoffset: 900;
  }
}


.rect {
    animation: bars 2s infinite;
    transform-origin: left;
    animation-delay: 0.1s;
    transform-box: fill-box;
}

.r5,.r6,.r7,.r10,.r12,.r14,.r16{
    animation-delay: 1s;
}

@keyframes bars {
        0% {
        transform: scaleX(1);
        }
        50% {
        transform: scaleX(.20);
        }
        100% {
        transform: scaleX(1);
        }
}
</style>
